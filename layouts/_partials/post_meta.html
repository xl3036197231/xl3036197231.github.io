{{- if not .Date.IsZero -}}
<time datetime="{{ .Date.Format "2006-01-02" }}">发布于 {{ .Date | time.Format (default "2006.01.02" site.Params.DateFormat) }}</time>
{{- end -}}
{{- with (partial "author.html" .) }}
<span class="post-meta-divider" aria-hidden="true">·</span>
<span>作者 {{ . }}</span>
{{- end }}

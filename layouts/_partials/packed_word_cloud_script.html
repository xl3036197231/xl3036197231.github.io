<script>
(() => {
    const clouds = [...document.querySelectorAll('[data-packed-cloud]')];
    if (!clouds.length) return;

    const hashText = (value) => {
        let hash = 2166136261;
        for (let index = 0; index < value.length; index += 1) {
            hash ^= value.charCodeAt(index);
            hash = Math.imul(hash, 16777619);
        }
        return hash >>> 0;
    };

    const overlaps = (candidate, placed, gap) => placed.some((box) => !(
        candidate.right + gap <= box.left ||
        candidate.left >= box.right + gap ||
        candidate.bottom + gap <= box.top ||
        candidate.top >= box.bottom + gap
    ));

    clouds.forEach((cloud) => {
        const stage = cloud.querySelector('[data-cloud-stage]');
        const words = [...cloud.querySelectorAll('[data-cloud-item]')];
        if (!stage || !words.length) return;

        let hasEnteredViewport = !('IntersectionObserver' in window);
        let fontMetricsReady = !document.fonts?.ready;
        let lastWidth = 0;
        let lastHeight = 0;
        let resizeFrame = 0;

        const resetWord = (word) => {
            word.style.removeProperty('font-size');
            word.style.removeProperty('left');
            word.style.removeProperty('top');
            word.style.removeProperty('transform');
            word.style.removeProperty('z-index');
            word.querySelector('small')?.style.removeProperty('transform');
        };

        const layout = () => {
            if (!hasEnteredViewport || !fontMetricsReady) return;
            const width = Math.floor(stage.getBoundingClientRect().width);
            const height = Math.floor(stage.getBoundingClientRect().height);
            if (width < 240 || height < 260) return;

            lastWidth = width;
            lastHeight = height;
            cloud.classList.remove('is-packed');
            cloud.classList.add('is-packing');
            words.forEach(resetWord);
            cloud.classList.remove('is-fallback');
            stage.style.removeProperty('min-height');

            const compact = width < 480 || window.innerHeight < 500;
            const maxCount = Math.max(1, ...words.map((word) => Number(word.dataset.cloudCount) || 0));
            const minFont = compact ? 14 : 16;
            const maxFont = compact ? 42 : 82;
            const padding = compact ? 12 : 16;
            const centerX = width / 2;
            const centerY = height / 2;

            const entries = words.map((word) => {
                const count = Number(word.dataset.cloudCount) || 0;
                const ratio = Math.log2(count + 1) / Math.log2(maxCount + 1);
                const isCategory = word.dataset.cloudKind === 'category';
                const categoryFloor = minFont + (isCategory ? (compact ? 3 : 6) : 0);
                const ceiling = maxFont - (isCategory ? 0 : (compact ? 8 : 12));
                let fontSize = count === 0
                    ? categoryFloor
                    : categoryFloor + ratio * Math.max(0, ceiling - categoryFloor);
                word.style.fontSize = Math.round(fontSize) + 'px';

                const maximumWordWidth = width * (compact ? 0.66 : 0.72);
                const measuredWidth = word.getBoundingClientRect().width;
                if (measuredWidth > maximumWordWidth) {
                    fontSize = Math.max(minFont, fontSize * maximumWordWidth / measuredWidth);
                    word.style.fontSize = Math.round(fontSize) + 'px';
                }

                return {
                    word,
                    count,
                    fontSize,
                    hash: hashText(word.dataset.cloudName || word.textContent || ''),
                    rotation: 0
                };
            }).sort((left, right) => right.fontSize - left.fontSize || right.count - left.count || left.hash - right.hash);

            entries.forEach((entry, index) => {
                const shortWord = (entry.word.dataset.cloudName || '').length <= 5;
                const allowRotation = index > 3 && shortWord && entry.hash % (compact ? 13 : 6) === 0;
                entry.rotation = allowRotation ? (entry.hash % 2 ? 90 : -90) : 0;
            });

            const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            let failed = true;
            for (let layoutAttempt = 0; layoutAttempt < 9 && failed && !reducedMotion; layoutAttempt += 1) {
                const placed = [];
                const globalScale = Math.pow(0.87, layoutAttempt);
                failed = false;

                for (const entry of entries) {
                    entry.word.style.removeProperty('left');
                    entry.word.style.removeProperty('top');
                    entry.word.style.transform = 'none';
                    const scaledFont = Math.max(minFont, entry.fontSize * globalScale);
                    entry.word.style.fontSize = Math.round(scaledFont) + 'px';
                    const rect = entry.word.getBoundingClientRect();
                    const rotation = (compact && layoutAttempt > 0) || layoutAttempt > 2 ? 0 : entry.rotation;
                    const rotated = Math.abs(rotation) === 90;
                    const boxWidth = (rotated ? rect.height : rect.width) + 2;
                    const boxHeight = (rotated ? rect.width : rect.height) + 2;
                    let found = null;

                    for (let step = 0; step < 4200; step += 1) {
                        const jitter = ((entry.hash >>> 8) % 1000) / 1000 - 0.5;
                        const angle = step * 0.47 + (entry.hash % 31) * 0.03 + jitter * 0.16;
                        const radius = 4.7 * Math.sqrt(step) + jitter * 7;
                        const x = centerX + Math.cos(angle) * radius * 1.08;
                        const y = centerY + Math.sin(angle) * radius;
                        const candidate = {
                            left: x - boxWidth / 2,
                            right: x + boxWidth / 2,
                            top: y - boxHeight / 2,
                            bottom: y + boxHeight / 2
                        };

                        if (
                            candidate.left < padding || candidate.right > width - padding ||
                            candidate.top < padding || candidate.bottom > height - padding ||
                            overlaps(candidate, placed, layoutAttempt > 3 ? 0 : (compact ? 1 : 2))
                        ) continue;

                        found = { x, y, rect, candidate, rotation };
                        break;
                    }

                    if (!found) {
                        failed = true;
                        break;
                    }

                    entry.word.style.left = found.x - found.rect.width / 2 + 'px';
                    entry.word.style.top = found.y - found.rect.height / 2 + 'px';
                    entry.word.style.transform = 'rotate(' + found.rotation + 'deg)';
                    entry.word.style.zIndex = String(2 + Math.min(8, entry.count));
                    const badge = entry.word.querySelector('small');
                    if (badge) badge.style.transform = 'translateX(-50%) rotate(' + (-found.rotation) + 'deg)';
                    placed.push(found.candidate);
                }

                if (!failed) {
                    const renderedBoxes = [];
                    for (const entry of entries) {
                        const rect = entry.word.getBoundingClientRect();
                        const rendered = {
                            left: rect.left,
                            right: rect.right,
                            top: rect.top,
                            bottom: rect.bottom
                        };
                        if (overlaps(rendered, renderedBoxes, 0)) {
                            failed = true;
                            break;
                        }
                        renderedBoxes.push(rendered);
                    }
                }
            }

            cloud.classList.remove('is-packing');
            if (failed) {
                cloud.classList.add('is-packing');
                const clamp = (value, min, max) => Math.min(max, Math.max(min, value));
                const fallbackScale = compact ? 0.45 : 0.58;
                const horizontalGap = compact ? 10 : 16;
                const rowGap = compact ? 6 : 12;

                // A loose row pack is the last-resort layout. It keeps every label
                // readable and adds staggered jitter without returning to a rigid grid.
                entries.forEach((entry) => {
                    entry.word.style.left = '0px';
                    entry.word.style.top = '0px';
                    entry.word.style.transform = 'none';
                    entry.word.style.fontSize = Math.round(Math.max(minFont, entry.fontSize * fallbackScale)) + 'px';
                });

                const rows = [];
                entries.forEach((entry) => {
                    const rect = entry.word.getBoundingClientRect();
                    let row = rows[rows.length - 1];
                    const nextWidth = row ? row.width + horizontalGap + rect.width : rect.width;
                    if (!row || nextWidth > width - padding * 2) {
                        row = { items: [], width: 0, height: 0 };
                        rows.push(row);
                    }
                    row.items.push({ entry, rect });
                    row.width += (row.items.length > 1 ? horizontalGap : 0) + rect.width;
                    row.height = Math.max(row.height, rect.height);
                });

                const requiredHeight = padding * 2 + rows.reduce((total, row) => total + row.height, 0) + rowGap * Math.max(0, rows.length - 1);
                const fallbackHeight = Math.max(height, requiredHeight);
                if (fallbackHeight > height) stage.style.minHeight = fallbackHeight + 'px';
                let rowTop = padding;
                rows.forEach((row, rowIndex) => {
                    const stagger = rowIndex % 2 ? Math.min(12, horizontalGap / 2) : 0;
                    let cursor = clamp((width - row.width) / 2 + stagger, padding, width - padding - row.width);
                    row.items.forEach(({ entry, rect }) => {
                        const jitterX = (((entry.hash >>> 5) % 1000) / 1000 - 0.5) * Math.min(4, horizontalGap * 0.35);
                        const jitterY = (((entry.hash >>> 17) % 1000) / 1000 - 0.5) * Math.min(3, rowGap * 0.35);
                        const x = clamp(cursor + rect.width / 2 + jitterX, padding + rect.width / 2, width - padding - rect.width / 2);
                        const y = rowTop + row.height / 2 + jitterY;
                        entry.word.style.left = x - rect.width / 2 + 'px';
                        entry.word.style.top = y - rect.height / 2 + 'px';
                        entry.word.style.transform = 'none';
                        entry.word.style.zIndex = String(2 + Math.min(8, entry.count));
                        const badge = entry.word.querySelector('small');
                        if (badge) badge.style.transform = 'translateX(-50%)';
                        cursor += rect.width + horizontalGap;
                    });
                    rowTop += row.height + rowGap;
                });
                cloud.classList.add('is-packed', 'is-fallback');
                cloud.classList.remove('is-packing');
            } else {
                cloud.classList.add('is-packed');
            }
        };

        const scheduleLayout = (force = false) => {
            if (resizeFrame) return;
            resizeFrame = window.requestAnimationFrame(() => {
                resizeFrame = 0;
                const width = Math.floor(stage.getBoundingClientRect().width);
                const height = Math.floor(stage.getBoundingClientRect().height);
                if (force || Math.abs(width - lastWidth) > 3 || Math.abs(height - lastHeight) > 3) layout();
            });
        };

        const start = () => {
            hasEnteredViewport = true;
            if (document.fonts?.ready) {
                document.fonts.ready.then(() => {
                    fontMetricsReady = true;
                    scheduleLayout(true);
                }, () => {
                    fontMetricsReady = true;
                    scheduleLayout(true);
                });
            } else {
                fontMetricsReady = true;
                scheduleLayout(true);
            }
        };

        if ('IntersectionObserver' in window) {
            const observer = new IntersectionObserver((entries) => {
                if (!entries.some((entry) => entry.isIntersecting)) return;
                observer.disconnect();
                start();
            }, { rootMargin: '320px 0px' });
            observer.observe(stage);
        } else {
            start();
        }

        const observeResize = (element, callback) => {
            if ('ResizeObserver' in window) {
                new ResizeObserver(callback).observe(element);
            } else {
                window.addEventListener('resize', callback, { passive: true });
            }
        };
        observeResize(stage, () => scheduleLayout());
    });
})();
</script>

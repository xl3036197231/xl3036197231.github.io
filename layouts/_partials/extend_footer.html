<script>
(() => {
    const canvas = document.getElementById('ambient-canvas');
    const root = document.documentElement;
    const motionQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
    const pointerQuery = window.matchMedia('(hover: hover) and (pointer: fine)');

    if (!canvas) return;

    const context = canvas.getContext('2d');
    if (!context) return;

    let width = 0;
    let height = 0;
    let devicePixelRatio = 1;
    let particles = [];
    let frameId = 0;
    let lastTime = 0;
    let pointerX = -1000;
    let pointerY = -1000;
    let pointerActive = false;

    const isDark = () => root.dataset.theme === 'dark';

    const resizeCanvas = () => {
        devicePixelRatio = Math.min(window.devicePixelRatio || 1, 2);
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = Math.floor(width * devicePixelRatio);
        canvas.height = Math.floor(height * devicePixelRatio);
        context.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
        rebuildParticles();
    };

    const rebuildParticles = () => {
        const night = isDark();
        const minimum = night ? 32 : 48;
        const maximum = night ? 68 : 110;
        const count = Math.min(maximum, Math.max(minimum, Math.round(width / (night ? 24 : 14))));

        particles = Array.from({ length: count }, () => ({
            x: Math.random() * width,
            y: Math.random() * height,
            radius: night ? Math.random() * 1.8 + 0.5 : Math.random() * 3.2 + 1.1,
            speed: night ? Math.random() * 0.10 + 0.03 : Math.random() * 0.55 + 0.24,
            drift: Math.random() * 0.6 + 0.2,
            phase: Math.random() * Math.PI * 2,
            alpha: night ? Math.random() * 0.48 + 0.22 : Math.random() * 0.32 + 0.24,
            velocityX: 0,
            velocityY: 0
        }));
    };

    const repelFromPointer = (particle, night) => {
        if (!pointerActive) return;

        const distanceX = particle.x - pointerX;
        const distanceY = particle.y - pointerY;
        const distance = Math.sqrt(distanceX * distanceX + distanceY * distanceY);
        const radius = night ? 96 : 132;

        if (distance <= 0 || distance >= radius) return;

        const influence = 1 - distance / radius;
        const impulse = influence * influence * (night ? 1.1 : 3.1);
        particle.velocityX += distanceX / distance * impulse;
        particle.velocityY += distanceY / distance * impulse;
    };

    const drawSnowflake = (particle, time) => {
        const radius = particle.radius * 2.2;
        context.save();
        context.translate(particle.x, particle.y);
        context.rotate(particle.phase + time * 0.00035);
        context.strokeStyle = 'rgba(148, 163, 184, ' + particle.alpha + ')';
        context.lineWidth = Math.max(0.8, particle.radius * 0.42);
        context.lineCap = 'round';

        for (let arm = 0; arm < 3; arm += 1) {
            context.rotate(Math.PI / 3);
            context.beginPath();
            context.moveTo(-radius, 0);
            context.lineTo(radius, 0);
            context.moveTo(radius * 0.45, 0);
            context.lineTo(radius * 0.72, radius * 0.28);
            context.moveTo(radius * 0.45, 0);
            context.lineTo(radius * 0.72, -radius * 0.28);
            context.stroke();
        }
        context.restore();
    };

    const render = (time) => {
        if (document.hidden) {
            frameId = 0;
            return;
        }

        const delta = Math.min((time - lastTime) / 16.67 || 1, 2);
        lastTime = time;
        const night = isDark();

        context.clearRect(0, 0, width, height);

        particles.forEach((particle) => {
            particle.y += particle.speed * delta;
            particle.x += Math.sin(time * 0.00045 + particle.phase) * particle.drift * delta;
            repelFromPointer(particle, night);
            particle.x += particle.velocityX * delta;
            particle.y += particle.velocityY * delta;
            particle.velocityX *= Math.pow(0.87, delta);
            particle.velocityY *= Math.pow(0.87, delta);

            if (particle.y > height + 16) {
                particle.y = -16;
                particle.x = Math.random() * width;
                particle.velocityY = 0;
            }

            if (particle.x > width + 16) {
                particle.x = -16;
            } else if (particle.x < -16) {
                particle.x = width + 16;
            }

            const shimmer = night
                ? particle.alpha * (0.72 + Math.sin(time * 0.0012 + particle.phase) * 0.28)
                : particle.alpha;

            if (night) {
                context.beginPath();
                context.arc(particle.x, particle.y, particle.radius, 0, Math.PI * 2);
                context.fillStyle = 'rgba(226, 232, 240, ' + shimmer + ')';
                context.fill();
            } else {
                drawSnowflake({ ...particle, alpha: shimmer }, time);
            }
        });

        frameId = window.requestAnimationFrame(render);
    };

    const start = () => {
        if (!motionQuery.matches && !frameId) {
            lastTime = performance.now();
            frameId = window.requestAnimationFrame(render);
        }
    };

    const pause = () => {
        if (frameId) {
            window.cancelAnimationFrame(frameId);
            frameId = 0;
        }
    };

    const movePointer = (event) => {
        pointerX = event.clientX;
        pointerY = event.clientY;
        pointerActive = true;
    };

    const clearPointer = () => {
        pointerActive = false;
        pointerX = -1000;
        pointerY = -1000;
    };

    resizeCanvas();
    start();

    if (pointerQuery.matches) {
        window.addEventListener('pointermove', movePointer, { passive: true });
        window.addEventListener('blur', clearPointer);
        document.documentElement.addEventListener('mouseleave', clearPointer);
    }

    window.addEventListener('resize', resizeCanvas, { passive: true });
    document.addEventListener('visibilitychange', () => {
        if (document.hidden) pause();
        else start();
    });

    motionQuery.addEventListener?.('change', () => {
        if (motionQuery.matches) {
            pause();
            context.clearRect(0, 0, width, height);
        } else {
            start();
        }
    });

    new MutationObserver(rebuildParticles).observe(root, {
        attributes: true,
        attributeFilter: ['data-theme']
    });
})();
</script>

<script>
(() => {
    const cursor = document.querySelector('.category-cursor');
    const pointerQuery = window.matchMedia('(hover: hover) and (pointer: fine)');
    const motionQuery = window.matchMedia('(prefers-reduced-motion: reduce)');

    if (!cursor || !pointerQuery.matches || motionQuery.matches) {
        return;
    }

    let targetX = -80;
    let targetY = -80;
    let currentX = targetX;
    let currentY = targetY;
    let frameId = 0;

    const followPointer = () => {
        currentX += (targetX - currentX) * 0.18;
        currentY += (targetY - currentY) * 0.18;
        cursor.style.setProperty('--cursor-x', currentX + 'px');
        cursor.style.setProperty('--cursor-y', currentY + 'px');

        if (Math.abs(targetX - currentX) > 0.2 || Math.abs(targetY - currentY) > 0.2) {
            frameId = window.requestAnimationFrame(followPointer);
        } else {
            frameId = 0;
        }
    };

    const movePointer = (event) => {
        targetX = event.clientX;
        targetY = event.clientY;
        cursor.classList.add('is-active');

        if (!frameId) {
            frameId = window.requestAnimationFrame(followPointer);
        }
    };

    const hideCursor = () => cursor.classList.remove('is-active');

    window.addEventListener('pointermove', movePointer, { passive: true });
    window.addEventListener('blur', hideCursor);
    document.documentElement.addEventListener('mouseleave', hideCursor);
})();
</script>

<script>
(() => {
    const heatmap = document.querySelector('.activity-heatmap');
    if (!heatmap) return;

    const grid = heatmap.querySelector('#activity-grid');
    const months = heatmap.querySelector('#activity-months');
    const tableBody = heatmap.querySelector('#activity-data-table tbody');
    const summary = document.getElementById('activity-summary');
    if (!grid || !months) return;

    let activity = [];
    try {
        activity = JSON.parse(heatmap.dataset.activity || '[]');
    } catch (error) {
        activity = [];
    }

    const counts = new Map();
    activity.forEach((item) => {
        counts.set(item.date, (counts.get(item.date) || 0) + 1);
    });

    const toKey = (date) => {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const day = String(date.getDate()).padStart(2, '0');
        return year + '-' + month + '-' + day;
    };

    const formatDate = (date) => new Intl.DateTimeFormat('zh-CN', {
        year: 'numeric',
        month: 'long',
        day: 'numeric'
    }).format(date);

    const end = new Date();
    end.setHours(12, 0, 0, 0);
    const start = new Date(end);
    start.setDate(start.getDate() - 364);
    start.setDate(start.getDate() - start.getDay());

    const monthLabels = [];
    let cursor = new Date(start);
    let column = 0;
    let activeDays = 0;

    while (true) {
        const key = toKey(cursor);
        const count = counts.get(key) || 0;
        const level = count === 0 ? 0 : count === 1 ? 1 : count <= 3 ? 2 : count <= 5 ? 3 : 4;
        const cell = document.createElement('button');
        cell.type = 'button';
        cell.className = 'activity-cell';
        cell.dataset.level = String(level);
        cell.setAttribute('role', 'gridcell');
        cell.setAttribute('aria-label', formatDate(cursor) + '，' + count + ' 篇文章');
        cell.title = formatDate(cursor) + ' · ' + count + ' 篇文章';
        grid.appendChild(cell);

        if (tableBody && cursor <= end) {
            const row = document.createElement('tr');
            const dateCell = document.createElement('th');
            const countCell = document.createElement('td');
            dateCell.scope = 'row';
            dateCell.textContent = formatDate(cursor);
            countCell.textContent = String(count);
            row.append(dateCell, countCell);
            tableBody.appendChild(row);
        }

        if (count > 0 && cursor <= end) activeDays += 1;
        if (cursor.getDay() === 0 && cursor.getDate() <= 7) {
            monthLabels.push({ label: (cursor.getMonth() + 1) + '月', column: column + 1 });
        }

        if (cursor.getDay() === 6 && cursor >= end) break;
        if (cursor.getDay() === 6) column += 1;
        cursor.setDate(cursor.getDate() + 1);
    }

    monthLabels.forEach((month) => {
        const label = document.createElement('span');
        label.textContent = month.label;
        label.style.gridColumn = String(month.column);
        months.appendChild(label);
    });

    if (summary) {
        summary.textContent = activeDays + ' 天有文章记录 · ' + activity.length + ' 篇文章 · 最近一年';
    }
})();
</script>

<script>
(() => {
    const interactionRoot = document.getElementById('site-interactions');
    const postRoot = document.querySelector('.post-engagement');
    if (!interactionRoot && !postRoot) return;

    const localPrefix = 'xiaoxing-like:';
    const storage = {
        get(key) {
            try { return localStorage.getItem(key); } catch (error) { return null; }
        },
        set(key, value) {
            try { localStorage.setItem(key, value); } catch (error) {}
        },
        keys() {
            try { return Object.keys(localStorage); } catch (error) { return []; }
        }
    };

    const localKey = (key) => localPrefix + encodeURIComponent(key);
    const localLikeTotal = () => storage.keys()
        .filter((key) => key.startsWith(localPrefix))
        .reduce((total, key) => total + Math.max(0, Number(storage.get(key)) || 0), 0);
    const numberFrom = (payload, fallback) => {
        const value = payload && (payload.total ?? payload.count ?? payload.likes);
        return Number.isFinite(Number(value)) ? Number(value) : fallback;
    };
    const setText = (selector, value) => {
        const element = document.querySelector(selector);
        if (element) element.textContent = String(value);
    };
    const setLikeState = (root, count) => {
        const button = root.querySelector('#post-like-button');
        const countElement = root.querySelector('#post-like-count');
        if (!button) return;
        button.removeAttribute('aria-pressed');
        button.querySelector('span').textContent = '点赞 +1';
        if (countElement) countElement.textContent = String(count);
    };

    const pulseLikeButton = (button) => {
        button.classList.remove('is-liked');
        void button.offsetWidth;
        button.classList.add('is-liked');
        window.setTimeout(() => button.classList.remove('is-liked'), 360);
    };

    const normalizePath = (value) => {
        let path = String(value || '').split('#')[0].split('?')[0];
        try { path = new URL(path, window.location.origin).pathname; } catch (error) {}
        try { path = decodeURIComponent(path); } catch (error) {}
        path = path.replace(/^\/+/, '/').replace(/\/{2,}/g, '/');
        if (path !== '/') path = path.replace(/\/+$/, '') + '/';
        return path || '/';
    };

    const loadCommentIssues = async (root) => {
        if (!root) return [];
        const repo = root.dataset.commentsRepo;
        const label = root.dataset.commentsLabel || 'comments';
        if (!repo) return [];
        const issues = [];
        for (let page = 1; page <= 3; page += 1) {
            const url = 'https://api.github.com/repos/' + repo + '/issues?state=all&labels=' + encodeURIComponent(label) + '&per_page=100&page=' + page;
            const response = await fetch(url, { headers: { Accept: 'application/vnd.github+json' } });
            if (!response.ok) throw new Error('GitHub comments request failed');
            const batch = await response.json();
            issues.push(...batch.filter((issue) => !issue.pull_request));
            if (batch.length < 100) break;
        }
        return issues;
    };

    const refreshCommentCounts = async () => {
        const root = interactionRoot || postRoot;
        try {
            const issues = await loadCommentIssues(root);
            const total = issues.reduce((sum, issue) => sum + (Number(issue.comments) || 0), 0);
            setText('#site-comment-count', total);
            document.querySelectorAll('.post-engagement[data-comment-key]').forEach((post) => {
                const key = normalizePath(post.dataset.commentKey);
                const issue = issues.find((item) => normalizePath(item.title) === key);
                const count = issue ? (Number(issue.comments) || 0) : 0;
                const countElement = post.querySelector('#post-comment-count');
                if (countElement) countElement.textContent = String(count);
            });
        } catch (error) {
            setText('#site-comment-count', '—');
        }
    };

    const getRemoteCount = async (endpoint, key) => {
        const response = await fetch(endpoint + '?key=' + encodeURIComponent(key), {
            headers: { Accept: 'application/json' }
        });
        if (!response.ok) throw new Error('Like count request failed');
        return numberFrom(await response.json(), null);
    };

    const syncPostLike = async (root) => {
        const button = root.querySelector('#post-like-button');
        const endpoint = (root.dataset.likesEndpoint || '').trim();
        const key = root.dataset.likeKey || window.location.pathname;
        let count = Math.max(0, Number(storage.get(localKey(key))) || 0);
        if (endpoint) {
            try { count = await getRemoteCount(endpoint, key); } catch (error) {}
        }
        setLikeState(root, count);
        if (!button) return;
        button.addEventListener('click', async () => {
            if (button.disabled) return;
            button.disabled = true;
            button.setAttribute('aria-busy', 'true');
            try {
                if (endpoint) {
                    const response = await fetch(endpoint, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
                        body: JSON.stringify({ action: 'like', key })
                    });
                    if (!response.ok) throw new Error('Like update failed');
                    count = numberFrom(await response.json(), count + 1);
                } else {
                    count += 1;
                    storage.set(localKey(key), String(count));
                }
                setLikeState(root, count);
                pulseLikeButton(button);
            } catch (error) {
                button.setAttribute('aria-busy', 'false');
            } finally {
                button.disabled = false;
                button.setAttribute('aria-busy', 'false');
            }
        });
    };

    const syncSiteLikes = async () => {
        if (!interactionRoot) return;
        const endpoint = (interactionRoot.dataset.likesEndpoint || '').trim();
        let total = localLikeTotal();
        if (endpoint) {
            try { total = await getRemoteCount(endpoint, 'site'); } catch (error) {}
        }
        setText('#site-like-count', total);
    };

    if (postRoot) syncPostLike(postRoot);
    syncSiteLikes();
    refreshCommentCounts();
})();
</script>

<script>
(() => {
    const panel = document.getElementById('tag-search-panel');
    const directory = document.querySelector('.tag-directory');
    if (!panel || !directory) return;

    const input = document.getElementById('tag-search-input');
    const select = document.getElementById('tag-category-filter');
    const clear = document.getElementById('tag-search-clear');
    const status = document.getElementById('tag-search-status');
    const items = [...directory.querySelectorAll('[data-tag-name]')];

    const filter = () => {
        const query = input.value.trim();
        const category = select.value;
        let matcher = null;
        if (query) {
            try {
                matcher = new RegExp(query, 'i');
                panel.classList.remove('has-error');
            } catch (error) {
                panel.classList.add('has-error');
                items.forEach((item) => { item.hidden = true; });
                status.textContent = '正则表达式无效，请检查括号、转义符或星号。';
                return;
            }
        } else {
            panel.classList.remove('has-error');
        }

        let visible = 0;
        items.forEach((item) => {
            const matchesText = !matcher || matcher.test(item.dataset.tagName || '');
            const matchesCategory = !category || item.dataset.tagCategory === category;
            item.hidden = !(matchesText && matchesCategory);
            if (!item.hidden) visible += 1;
        });

        if (!query && !category) {
            status.textContent = items.length + ' 个标签，输入一个字即可开始匹配。';
        } else if (visible) {
            status.textContent = '匹配到 ' + visible + ' 个标签。';
        } else {
            status.textContent = '没有匹配结果，可以换一个字或切换分类。';
        }
    };

    input.addEventListener('input', filter);
    select.addEventListener('change', filter);
    clear.addEventListener('click', () => {
        input.value = '';
        select.value = '';
        input.focus();
        filter();
    });
    filter();
})();
</script>

<script>
(() => {
    const chart = document.querySelector('.liveline-chart');
    const canvas = chart && chart.querySelector('#activity-liveline');
    if (!chart || !canvas) return;

    const context = canvas.getContext('2d');
    const root = document.documentElement;
    const motionQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
    const badge = chart.querySelector('#activity-liveline-badge');
    const tooltip = chart.querySelector('#activity-liveline-tooltip');
    const tooltipDate = tooltip && tooltip.querySelector('strong');
    const tooltipValue = tooltip && tooltip.querySelector('span');
    let activity = [];
    let points = [];
    let hoverIndex = -1;
    let currentIndex = -1;
    let width = 0;
    let height = 0;
    let devicePixelRatio = 1;
    let pulse = 0;
    let frameId = 0;

    try {
        activity = JSON.parse(chart.dataset.activity || '[]');
    } catch (error) {
        activity = [];
    }

    const counts = new Map();
    activity.forEach((item) => {
        counts.set(item.date, (counts.get(item.date) || 0) + 1);
    });

    const toKey = (date) => {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const day = String(date.getDate()).padStart(2, '0');
        return year + '-' + month + '-' + day;
    };

    const formatDate = (date) => new Intl.DateTimeFormat('zh-CN', {
        year: 'numeric',
        month: 'long',
        day: 'numeric'
    }).format(date);

    const end = new Date();
    end.setHours(12, 0, 0, 0);
    const startDate = new Date(end);
    startDate.setDate(startDate.getDate() - 364);

    for (let index = 0; index < 365; index += 1) {
        const date = new Date(startDate);
        date.setDate(startDate.getDate() + index);
        points.push({
            date,
            key: toKey(date),
            count: counts.get(toKey(date)) || 0
        });
        if (points[points.length - 1].count > 0) currentIndex = points.length - 1;
    }

    if (!points.length) return;
    if (currentIndex < 0) currentIndex = points.length - 1;

    const cssColor = (name, fallback) => getComputedStyle(root).getPropertyValue(name).trim() || fallback;
    const withAlpha = (color, alpha) => {
        if (color.charAt(0) !== '#') return color;
        const value = color.slice(1);
        const hex = value.length === 3
            ? value.split('').map((part) => part + part).join('')
            : value;
        const number = parseInt(hex, 16);
        return 'rgba(' + ((number >> 16) & 255) + ', ' + ((number >> 8) & 255) + ', ' + (number & 255) + ', ' + alpha + ')';
    };

    const layout = () => ({
        left: 38,
        right: 18,
        top: 24,
        bottom: 34
    });

    const resize = () => {
        const rect = chart.getBoundingClientRect();
        width = Math.max(1, rect.width);
        height = Math.max(240, rect.height);
        devicePixelRatio = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.floor(width * devicePixelRatio);
        canvas.height = Math.floor(height * devicePixelRatio);
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';
        context.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
        draw();
    };

    const geometry = () => {
        const padding = layout();
        const maxCount = Math.max(1, ...points.map((point) => point.count));
        const chartWidth = Math.max(1, width - padding.left - padding.right);
        const chartHeight = Math.max(1, height - padding.top - padding.bottom);
        const plotted = points.map((point, index) => ({
            ...point,
            x: padding.left + (index / Math.max(1, points.length - 1)) * chartWidth,
            y: padding.top + chartHeight - (point.count / maxCount) * chartHeight
        }));
        return { padding, maxCount, chartWidth, chartHeight, plotted };
    };

    const setBadge = (index) => {
        if (!badge) return;
        const point = points[index] || points[currentIndex];
        badge.textContent = (point ? point.count : 0) + ' 篇';
        badge.setAttribute('aria-label', (point ? formatDate(point.date) : '当前') + '，' + (point ? point.count : 0) + ' 篇文章');
    };

    const showTooltip = (index, clientX) => {
        if (!tooltip || !tooltipDate || !tooltipValue) return;
        const point = points[index];
        if (!point) return;
        tooltip.hidden = false;
        tooltipDate.textContent = formatDate(point.date);
        tooltipValue.textContent = point.count + ' 篇文章';
        const rect = chart.getBoundingClientRect();
        const left = Math.min(Math.max(12, clientX - rect.left + 12), Math.max(12, rect.width - 148));
        tooltip.style.left = left + 'px';
        tooltip.style.top = '10px';
        setBadge(index);
    };

    const hideTooltip = () => {
        if (tooltip) tooltip.hidden = true;
        setBadge(currentIndex);
    };

    const draw = () => {
        if (!width || !height) return;
        const { padding, maxCount, chartWidth, chartHeight, plotted } = geometry();
        const blue = cssColor('--template-blue', '#4f46e5');
        const violet = cssColor('--template-violet', '#7c3aed');
        const primary = cssColor('--primary', '#18181b');
        const secondary = cssColor('--secondary', '#52525b');
        const border = cssColor('--border', '#dedee3');
        const entry = cssColor('--entry', '#ffffff');

        context.clearRect(0, 0, width, height);
        context.font = '11px Public Sans, sans-serif';
        context.textAlign = 'right';
        context.textBaseline = 'middle';

        for (let tick = 0; tick <= 3; tick += 1) {
            const y = padding.top + chartHeight - (tick / 3) * chartHeight;
            context.beginPath();
            context.setLineDash([3, 5]);
            context.moveTo(padding.left, y);
            context.lineTo(width - padding.right, y);
            context.strokeStyle = withAlpha(border, 0.72);
            context.lineWidth = 1;
            context.stroke();
            context.setLineDash([]);
            context.fillStyle = secondary;
            context.fillText(String(Math.round((maxCount / 3) * tick)), padding.left - 10, y);
        }

        context.textAlign = 'left';
        context.textBaseline = 'alphabetic';
        const labelIndexes = [0, Math.floor((points.length - 1) / 2), points.length - 1];
        labelIndexes.forEach((index) => {
            const point = plotted[index];
            if (!point) return;
            context.fillStyle = secondary;
            context.fillText((point.date.getMonth() + 1) + '月' + point.date.getDate() + '日', point.x - (index === points.length - 1 ? 48 : 0), height - 10);
        });

        const area = context.createLinearGradient(0, padding.top, 0, height - padding.bottom);
        area.addColorStop(0, withAlpha(blue, 0.30));
        area.addColorStop(1, withAlpha(violet, 0.01));
        context.beginPath();
        context.moveTo(plotted[0].x, height - padding.bottom);
        context.lineTo(plotted[0].x, plotted[0].y);
        for (let index = 1; index < plotted.length; index += 1) {
            const previous = plotted[index - 1];
            const point = plotted[index];
            const middleX = (previous.x + point.x) / 2;
            const middleY = (previous.y + point.y) / 2;
            context.quadraticCurveTo(previous.x, previous.y, middleX, middleY);
            context.quadraticCurveTo(point.x, point.y, point.x, point.y);
        }
        context.lineTo(plotted[plotted.length - 1].x, height - padding.bottom);
        context.closePath();
        context.fillStyle = area;
        context.fill();

        context.beginPath();
        context.moveTo(plotted[0].x, plotted[0].y);
        for (let index = 1; index < plotted.length; index += 1) {
            const previous = plotted[index - 1];
            const point = plotted[index];
            const middleX = (previous.x + point.x) / 2;
            const middleY = (previous.y + point.y) / 2;
            context.quadraticCurveTo(previous.x, previous.y, middleX, middleY);
            context.quadraticCurveTo(point.x, point.y, point.x, point.y);
        }
        context.strokeStyle = blue;
        context.lineWidth = 2.4;
        context.lineJoin = 'round';
        context.lineCap = 'round';
        context.stroke();

        if (hoverIndex >= 0 && plotted[hoverIndex]) {
            const point = plotted[hoverIndex];
            context.beginPath();
            context.setLineDash([4, 5]);
            context.moveTo(point.x, padding.top);
            context.lineTo(point.x, height - padding.bottom);
            context.strokeStyle = withAlpha(violet, 0.72);
            context.lineWidth = 1;
            context.stroke();
            context.setLineDash([]);
            context.beginPath();
            context.arc(point.x, point.y, 5, 0, Math.PI * 2);
            context.fillStyle = entry;
            context.fill();
            context.strokeStyle = violet;
            context.lineWidth = 2;
            context.stroke();
        }

        const live = plotted[currentIndex] || plotted[plotted.length - 1];
        if (live) {
            const radius = 5 + Math.sin(pulse) * 1.4;
            context.beginPath();
            context.arc(live.x, live.y, radius + 6, 0, Math.PI * 2);
            context.fillStyle = withAlpha(blue, 0.12);
            context.fill();
            context.beginPath();
            context.arc(live.x, live.y, radius, 0, Math.PI * 2);
            context.fillStyle = blue;
            context.fill();
            context.beginPath();
            context.arc(live.x, live.y, 2.2, 0, Math.PI * 2);
            context.fillStyle = entry;
            context.fill();
        }

        context.fillStyle = primary;
        setBadge(hoverIndex >= 0 ? hoverIndex : currentIndex);
    };

    const indexAt = (event) => {
        const rect = canvas.getBoundingClientRect();
        const padding = layout();
        const x = Math.min(Math.max(padding.left, event.clientX - rect.left), rect.width - padding.right);
        const ratio = (x - padding.left) / Math.max(1, rect.width - padding.left - padding.right);
        return Math.min(points.length - 1, Math.max(0, Math.round(ratio * (points.length - 1))));
    };

    canvas.addEventListener('pointermove', (event) => {
        hoverIndex = indexAt(event);
        showTooltip(hoverIndex, event.clientX);
        draw();
    }, { passive: true });

    canvas.addEventListener('pointerleave', () => {
        hoverIndex = -1;
        hideTooltip();
        draw();
    });

    canvas.addEventListener('focus', () => {
        if (hoverIndex < 0) hoverIndex = currentIndex;
        const point = points[hoverIndex];
        if (point) showTooltip(hoverIndex, chart.getBoundingClientRect().left + point.x);
        draw();
    });

    canvas.addEventListener('blur', () => {
        hoverIndex = -1;
        hideTooltip();
        draw();
    });

    canvas.addEventListener('keydown', (event) => {
        if (event.key !== 'ArrowLeft' && event.key !== 'ArrowRight' && event.key !== 'Escape') return;
        event.preventDefault();
        if (event.key === 'Escape') {
            hoverIndex = -1;
            hideTooltip();
            draw();
            return;
        }
        hoverIndex = Math.min(points.length - 1, Math.max(0, hoverIndex + (event.key === 'ArrowRight' ? 1 : -1)));
        const point = points[hoverIndex];
        if (point) showTooltip(hoverIndex, chart.getBoundingClientRect().left + point.x);
        draw();
    });

    const animate = () => {
        if (document.hidden || motionQuery.matches) {
            frameId = 0;
            return;
        }
        pulse += 0.06;
        draw();
        frameId = window.requestAnimationFrame(animate);
    };

    const start = () => {
        if (!motionQuery.matches && !frameId) frameId = window.requestAnimationFrame(animate);
    };

    const stop = () => {
        if (frameId) {
            window.cancelAnimationFrame(frameId);
            frameId = 0;
        }
    };

    resize();
    setBadge(currentIndex);
    start();
    new ResizeObserver(resize).observe(chart);
    new MutationObserver(draw).observe(root, { attributes: true, attributeFilter: ['data-theme'] });
    document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());
    motionQuery.addEventListener?.('change', () => {
        motionQuery.matches ? stop() : start();
        draw();
    });
})();
</script>

<script>
(() => {
    const toc = document.querySelector('.post-toc');
    if (!toc) return;

    const links = Array.from(toc.querySelectorAll('#TableOfContents a'));
    const items = links.map((link) => {
        const href = link.getAttribute('href') || '';
        if (!href.startsWith('#')) return null;

        let id = href.slice(1);
        try {
            id = decodeURIComponent(id);
        } catch (_) {
            // Keep the original id when a legacy anchor is not URI-encoded.
        }

        const heading = document.getElementById(id);
        return heading ? { link, heading } : null;
    }).filter(Boolean);

    if (!items.length) return;

    const setActive = (current) => {
        items.forEach(({ link, heading }) => {
            const active = heading === current;
            link.classList.toggle('is-active', active);
            if (active) {
                link.setAttribute('aria-current', 'location');
            } else {
                link.removeAttribute('aria-current');
            }
        });
    };

    const update = () => {
        const headerHeight = Number.parseFloat(
            getComputedStyle(document.documentElement).getPropertyValue('--header-height'),
        ) || 68;
        const threshold = headerHeight + 44;
        let current = items[0].heading;

        items.forEach(({ heading }) => {
            if (heading.getBoundingClientRect().top <= threshold) current = heading;
        });

        setActive(current);
    };

    let frame = 0;
    const scheduleUpdate = () => {
        if (frame) return;
        frame = window.requestAnimationFrame(() => {
            frame = 0;
            update();
        });
    };

    window.addEventListener('scroll', scheduleUpdate, { passive: true });
    window.addEventListener('resize', scheduleUpdate, { passive: true });
    links.forEach((link) => link.addEventListener('click', () => {
        window.setTimeout(update, 180);
    }));
    update();
})();
</script>

{{- $mazeSecPaths := slice -}}
{{- range site.RegularPages -}}
    {{- if in .Params.categories "靶机" -}}
        {{- $mazeSecPaths = $mazeSecPaths | append .RelPermalink -}}
    {{- end -}}
{{- end -}}
<script>
(() => {
    const restrictedPaths = new Set({{ $mazeSecPaths | jsonify }});
    if (!restrictedPaths.size) return;

    const normalizePath = (value) => {
        let url;
        try {
            url = new URL(value, window.location.href);
        } catch (_) {
            return '';
        }
        if (url.origin !== window.location.origin) return '';

        let path = url.pathname || '/';
        try {
            path = decodeURIComponent(path);
        } catch (_) {
            // Keep the encoded path when it contains a malformed escape.
        }
        path = path.replace(/\/+$/, '/');
        return path || '/';
    };

    const isRestrictedArticle = (anchor) => restrictedPaths.has(normalizePath(anchor.href));
    let dialog;
    let input;
    let error;
    let pendingHref = '';
    let lastFocused;

    const ensureDialog = () => {
        if (dialog) return;

        dialog = document.createElement('dialog');
        dialog.className = 'mazesec-gate-dialog';
        dialog.setAttribute('aria-labelledby', 'mazesec-gate-title');
        dialog.innerHTML = `
            <form class="mazesec-gate-form">
                <span class="mazesec-gate-kicker">MAZESEC / ACCESS CHECK</span>
                <h2 id="mazesec-gate-title">进入靶机记录</h2>
                <p class="mazesec-gate-description">这部分记录需要先输入 MazeSec 公开 QQ 群号。</p>
                <label class="mazesec-gate-label" for="mazesec-gate-input">公开 QQ 群号</label>
                <input class="mazesec-gate-input" id="mazesec-gate-input" type="text" inputmode="numeric" autocomplete="off" maxlength="12" aria-describedby="mazesec-gate-error">
                <p class="mazesec-gate-error" id="mazesec-gate-error" role="alert" hidden>群号不正确，请重新输入。</p>
                <div class="mazesec-gate-actions">
                    <button type="button" data-gate-cancel>返回</button>
                    <button type="submit">验证并进入</button>
                </div>
            </form>
        `;
        document.body.appendChild(dialog);

        const form = dialog.querySelector('.mazesec-gate-form');
        input = dialog.querySelector('#mazesec-gate-input');
        error = dialog.querySelector('#mazesec-gate-error');
        const cancel = dialog.querySelector('[data-gate-cancel]');

        form.addEventListener('submit', (event) => {
            event.preventDefault();
            if (input.value.replace(/\s+/g, '') !== '321948805') {
                input.setAttribute('aria-invalid', 'true');
                error.hidden = false;
                input.focus();
                return;
            }

            const target = pendingHref;
            dialog.close();
            pendingHref = '';
            window.location.assign(target);
        });

        input.addEventListener('input', () => {
            input.removeAttribute('aria-invalid');
            error.hidden = true;
        });

        cancel.addEventListener('click', () => dialog.close());
        dialog.addEventListener('click', (event) => {
            if (event.target === dialog) dialog.close();
        });
        dialog.addEventListener('close', () => {
            pendingHref = '';
            if (lastFocused && typeof lastFocused.focus === 'function') {
                lastFocused.focus({ preventScroll: true });
            }
        });
    };

    const openDialog = (href, source) => {
        ensureDialog();
        pendingHref = href;
        lastFocused = source;
        input.value = '';
        input.removeAttribute('aria-invalid');
        error.hidden = true;

        if (typeof dialog.showModal !== 'function') {
            const answer = window.prompt('请输入 MazeSec 公开 QQ 群号');
            if (answer && answer.replace(/\s+/g, '') === '321948805') {
                window.location.assign(href);
            }
            return;
        }

        dialog.showModal();
        window.setTimeout(() => input.focus(), 0);
    };

    document.addEventListener('click', (event) => {
        if (event.defaultPrevented || event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;

        const target = event.target;
        const anchor = target instanceof Element ? target.closest('a[href]') : null;
        if (!anchor || !isRestrictedArticle(anchor)) return;

        event.preventDefault();
        openDialog(anchor.href, anchor);
    }, true);
})();
</script>

<section class="fuwari-banner" aria-labelledby="fuwari-banner-title">
    <img src="{{ "/images/fuwari-window.jpeg" | relURL }}" alt="绿色窗台上的黄色小角色与咖啡" width="886" height="886" loading="eager" decoding="async">
    <div class="fuwari-banner-shade" aria-hidden="true"></div>
    <div class="fuwari-banner-copy">
        <span class="caps-label">XIAOXING / DIGITAL GARDEN</span>
        <h1 id="fuwari-banner-title">在代码与生活之间<br><em>保持好奇</em></h1>
        <p>学业、靶机、CTF、科研与生活随记，持续整理成自己的知识花园。</p>
        <div class="fuwari-banner-actions">
            <a class="fuwari-banner-action" href="{{ "/posts/" | relLangURL }}">浏览文章 <span aria-hidden="true">↗</span></a>
            <span class="fuwari-banner-stats">{{ len (where site.RegularPages "Section" "posts") }} 篇记录 · {{ now.Format "2006" }}</span>
        </div>
    </div>
    <div class="fuwari-banner-mark" aria-hidden="true">
        <span>01</span>
        <span>READ / MAKE / WRITE</span>
    </div>
    <div class="fuwari-banner-scroll" aria-hidden="true">
        <span>SCROLL TO EXPLORE</span>
        <span>↓</span>
    </div>
    <div class="fuwari-banner-rail">
        <span class="fuwari-banner-rail-label">WINDOW / 01</span>
        <span class="fuwari-banner-rail-copy">绿色窗台上的小角色与一杯咖啡</span>
        <a class="fuwari-banner-rail-link" href="{{ "/images/fuwari-window.jpeg" | relURL }}" target="_blank" rel="noopener" aria-label="打开顶部背景图完整图片">
            <span>查看完整图片</span><span aria-hidden="true">↗</span>
        </a>
    </div>
</section>

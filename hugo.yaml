baseURL: "https://xl3036197231.github.io/"
locale: "zh-CN"
defaultContentLanguage: "zh"
title: "小星的秘密花园"
copyright: "迷惘的小星"

theme:
 - PaperMod

enableRobotsTXT: true

params:
  env: production
  title: "小星的秘密花园"
  description: "小星的秘密花园，记录学业、靶机、CTF 题解、CTF 知识点笔记、比赛日记、生活随记与科研。"
  author: "迷惘的小星"
  keywords:
    - 技术博客
    - 编程
    - 学业
    - 靶机
    - CTF 题解
    - CTF 知识点笔记

  blogCategories:
    - name: "学业"
      code: "01"
      label: "ACADEMIC"
      description: "课程、备考与值得长期积累的学习记录。"
    - name: "靶机"
      code: "02"
      label: "LAB / BOX"
      description: "从信息收集到漏洞验证，记录靶场里的完整过程。"
    - name: "CTF 题解"
      code: "03"
      label: "CTF / WRITE-UP"
      description: "把比赛和练习中的解题思路拆开，留下可复盘的线索。"
    - name: "CTF 知识点笔记"
      code: "04"
      label: "CTF / NOTES"
      description: "整理工具、原理与常见题型，建立自己的知识索引。"
    - name: "比赛日记"
      code: "05"
      label: "COMPETITION / DIARY"
      description: "记录比赛现场、赛后复盘和每一次没有白走的弯路。"
    - name: "生活随记"
      code: "06"
      label: "LIFE / NOTES"
      description: "技术之外的日常、灵感与正在形成的生活观察。"
    - name: "科研"
      code: "07"
      label: "RESEARCH / LAB"
      description: "整理科研阅读、实验过程和仍在探索的问题。"

  tagGroups:
    - category: "学业"
      tags:
        - "博客"
    - category: "生活随记"
      tags:
        - "随笔"
    - category: "CTF 知识点笔记"
      tags:
        - "SQL 注入"
        - "CTF"
        - "Web 安全"

  comments:
    enabled: true
    provider: "utterances"
    repo: "xl3036197231/xl3036197231.github.io"
    issueTerm: "pathname"
    label: "comments"
    theme: "preferred-color-scheme"

  likes:
    enabled: true
    namespace: "xiaoxing-blog"
    endpoint: ""

  images:
    - "/og.png"

  defaultTheme: auto
  disableThemeToggle: false
  mainSections:
    - posts
  DateFormat: "2006.01.02"

  ShowReadingTime: true
  ShowWordCount: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowRssButtonInSectionTermList: true

  label:
    text: "小星的秘密花园"

  homeInfoParams:
    Eyebrow: "XIAOXING / NOTES & BUILDS"
    TitleLead: "小星的"
    TitleAccent: "秘密"
    TitleTail: "花园"
    Content: "这里按学业、靶机、CTF 题解、CTF 知识点笔记、比赛日记、生活随记与科研整理记录。把复杂的事情讲清楚，也给尚未想明白的问题留一个位置。"
    PrimaryLabel: "开始阅读"
    PrimaryURL: "/posts/"
    SecondaryLabel: "关于小星"
    SecondaryURL: "/about/"
    Field: "CTF · Web · Study"
    Status: "持续更新"
    Since: "2026"

  socialIcons:
    - name: github
      url: "https://github.com/xl3036197231"

  footer:
    text: "在代码与生活之间，保持好奇。"

  assets:
    favicon: "/favicon.svg"
    favicon16x16: "/favicon-16x16.png"
    favicon32x32: "/favicon-32x32.png"
    apple_touch_icon: "/apple-touch-icon.png"
    safari_pinned_tab: "/favicon.svg"
    theme_color: "#FAFAFA"
    msapplication_TileColor: "#FAFAFA"

menu:
  main:
    - identifier: home
      name: "首页"
      url: "/"
      weight: 5

    - identifier: posts
      name: "文章"
      url: "/posts/"
      weight: 10

    - identifier: categories
      name: "分类"
      url: "/categories/"
      weight: 20

    - identifier: archives
      name: "归档"
      url: "/archives/"
      weight: 30

    - identifier: tags
      name: "标签"
      url: "/tags/"
      weight: 40

    - identifier: friends
      name: "友链"
      url: "/friends/"
      weight: 50

    - identifier: about
      name: "关于"
      url: "/about/"
      weight: 60
